<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12203A">
  <title>¿Qué Como? · Conectando</title>
  <style>
    :root { --fondo: #F5F7FB; --texto: #12203A; --tenue: #5B6B86; --acento: #F27A1A; --borde: #E3E9F2; }
    @media (prefers-color-scheme: dark) {
      :root { --fondo: #0D1626; --texto: #E6ECF5; --tenue: #8FA3C2; --borde: #22314F; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px 16px; background: var(--fondo); color: var(--texto);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 420px; text-align: center; }
    img { width: 88px; height: 88px; border-radius: 22px; }
    h1 { font-size: 1.4rem; margin: 20px 0 8px; letter-spacing: -0.01em; }
    p { color: var(--tenue); line-height: 1.5; margin: 0 0 12px; }
    button {
      margin-top: 12px; min-height: 48px; padding: 0 28px; border: 0; border-radius: 12px;
      background: var(--acento); color: #fff; font: inherit; font-weight: 700; cursor: pointer;
    }
    button:focus-visible { outline: 3px solid #2456A6; outline-offset: 3px; }
    #estado { font-size: .9rem; min-height: 1.4em; }
    .punto { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--acento);
             margin-right: 6px; animation: latido 1.2s ease-in-out infinite; }
    @keyframes latido { 50% { opacity: .25; } }
    @media (prefers-reduced-motion: reduce) { .punto { animation: none; } }
  </style>
</head>
<body>
  <main>
    <img src="/recursos/iconos/icono-192.png" alt="">
    <h1>Conectando con ¿Qué Como?</h1>
    <p>No hay conexión a internet o el servidor está despertando. Si la app llevaba un rato
       sin usarse, puede tardar hasta un minuto.</p>
    <p id="estado" role="status" aria-live="polite"><span class="punto" aria-hidden="true"></span>Reintentando automáticamente…</p>
    <button type="button" id="reintentar">Reintentar ahora</button>
  </main>
  <script>
    (function () {
      var ocupado = false;
      function comprobar() {
        if (ocupado) return;
        ocupado = true;
        var control = new AbortController();
        var limite = setTimeout(function () { control.abort(); }, 15000);
        fetch("/salud", { cache: "no-store", signal: control.signal })
          .then(function (r) { if (r.ok) location.reload(); })
          .catch(function () {})
          .finally(function () { clearTimeout(limite); ocupado = false; });
      }
      document.getElementById("reintentar").addEventListener("click", comprobar);
      window.addEventListener("online", comprobar);
      setInterval(comprobar, 5000);
    })();
  </script>
</body>
</html>
