org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# ============================================================================
# Configuración de la app ¿Qué Como? — EDITA AQUÍ antes de publicar
# ============================================================================
# Nombre del paquete en Google Play. Es PERMANENTE: una vez que subas la
# primera versión no se puede cambiar. Debe coincidir con la variable
# QUECOMO_ANDROID_PAQUETE del servidor.
quecomo.applicationId=mx.quecomo.app

# Dominio donde está desplegada la app web (sin https:// ni diagonal final).
quecomo.host=que-como.onrender.com

# Versión. versionCode debe AUMENTAR en cada subida a Google Play
# (el flujo de GitHub Actions lo sobrescribe con el número de ejecución).
quecomo.versionCode=1
quecomo.versionName=1.0.0
